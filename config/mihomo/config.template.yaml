# mihomo runtime configuration template for the NUC.
#
# The render script (config/mihomo/render.py) substitutes the placeholder
# tokens for the controller secret, the controller bind address, the mixed-port
# LAN switch, the LAN allow list, the subscription provider block, the runtime
# custom proxies, and the override proxy-groups/rules. Substituted values must
# never appear literally in this header, so the tokens are only spelled out at
# their use sites below.
#
# The subscription only carries proxy nodes; proxy groups, rule-providers and
# rules come from an external Clash override document fetched by render.py.
#
# Never put a subscription URL, node address, or node credential in this file:
# those live only in the runtime secret files and the rendered state directory.

mixed-port: 7890
mode: rule
log-level: info
ipv6: false
allow-lan: __ALLOW_LAN__
__LAN_ALLOWED_IPS__find-process-mode: off
unified-delay: true
tcp-concurrent: true

external-controller: "__CONTROLLER_ENDPOINT__"
secret: "__CONTROLLER_SECRET__"

profile:
  store-selected: true
  store-fake-ip: true

# Keep the GEO databases fresh from a China-friendly mirror. Rule matching
# falls back to the last successful download when the mirror is unreachable.
geodata-mode: true
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

dns:
  enable: true
  ipv6: false
  # default-nameserver must contain IP literals; it resolves the DNS servers.
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # Domestic DoH resolves CN names; non-CN names that the primary servers
  # answer with non-CN IPs are re-resolved through a trusted foreign DoH. The
  # foreign servers are only used for names that actually resolve abroad, so
  # CN CDNs (including the rule-provider mirror) keep resolving domestically.
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  # Node server hostnames (and the subscription URL host) must resolve
  # directly through domestic DNS so they never loop back through the tunnel.
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

# __PROXY_PROVIDERS__

# Custom nodes are declared at the top level (not as a provider) so that
# dialer-proxy chains between them resolve; the override's include-all groups
# still pick them up.
# __CUSTOM_PROXIES__

# Proxy groups, rule-providers and rules come from the external override
# document. render.py splices them into the placeholders below.
# __PROXY_GROUPS__

# __RULES__
